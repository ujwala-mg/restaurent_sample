<section id="top" class="hero">

    <!-- Full-screen hero image -->
    <div class="hero-media" aria-hidden="true">
        <img src="/images/hero/matsya-hero.png"
             alt="" />
    </div>

    <!-- Cinematic dark overlay -->
    <div class="hero-scrim"></div>

    <!-- Hero content -->
    <div class="wrap hero-content">

        <p class="hero-kicker hero-anim hero-anim--1">
            Kurnool Road · Andhra Pradesh
        </p>

        <h1 class="hero-title">
            <span class="hero-anim hero-anim--2">
                Matsya
            </span>

            <span class="hero-anim hero-anim--3">
                Amazon Kitchens
            </span>
        </h1>

        <p class="hero-headline hero-anim hero-anim--4">
            Authentic Andhra flavours.<br />
            Made to be remembered.
        </p>

        <p class="hero-sub hero-anim hero-anim--5">
            Generous hospitality and a memorable dining stop on your journey.
        </p>

        <div class="hero-actions hero-anim hero-anim--6">

            <a class="btn btn--solid"
               href="#menu">
                View Menu
            </a>

            <a class="btn btn--line"
               [href]="restaurant.directionsHref"
               target="_blank"
               rel="noopener">
                Get Directions
            </a>

        </div>

        <p class="hero-status hero-anim hero-anim--6">
            <span class="dot"
                  aria-hidden="true"></span>

            Open today · {{ restaurant.hoursLabel }}
        </p>

    </div>

    <!-- Scroll indicator -->
    <div class="scroll-cue"
         aria-hidden="true">
        <span></span>
    </div>

</section>
